name: CH UMER POS - Android CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build CH UMER POS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show Java version
        run: java -version

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Clean project
        run: ./gradlew clean --stacktrace

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify build outputs
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -print

          echo "=== AAB FILES ==="
          find . -type f -name "*.aab" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CH-UMER-POS-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CH-UMER-POS-Release-APK
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: CH-UMER-POS-Release-AAB
          path: "**/build/outputs/bundle/release/*.aab"
          if-no-files-found: error
          retention-days: 30
