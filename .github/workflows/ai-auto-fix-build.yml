name: CH UMER POS - AI Auto Fix & Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ai-auto-fix-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Install Gradle 8.11.1
        run: |
          if [ ! -f "./gradlew" ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
            unzip -q gradle-8.11.1-bin.zip -d "$HOME/gradle"
            export PATH="$HOME/gradle/gradle-8.11.1/bin:$PATH"
            gradle wrapper --gradle-version 8.11.1
            chmod +x ./gradlew
          fi

      - name: AI Fix and Build Loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e

          MAX_ATTEMPTS=3
          SUCCESS=0

          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            echo "=========================================="
            echo "AI BUILD ATTEMPT: $ATTEMPT / $MAX_ATTEMPTS"
            echo "=========================================="

            chmod +x ./gradlew

            ./gradlew clean assembleDebug bundleRelease \
              --no-daemon \
              --stacktrace \
              2>&1 | tee build-error.log

            BUILD_EXIT=${PIPESTATUS[0]}

            if [ "$BUILD_EXIT" -eq 0 ]; then
              echo "BUILD SUCCESSFUL"
              SUCCESS=1
              break
            fi

            echo "BUILD FAILED"

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "Maximum AI repair attempts reached."
              break
            fi

            echo "Sending build error to Gemini AI..."

            npx --yes @google/gemini-cli \
              --approval-mode yolo \
              -p "
You are the senior Android build engineer for the CH UMER POS application.

The GitHub repository is the complete POS Android project.

A Gradle build has failed.

Your job:
1. Inspect the entire repository.
2. Read build-error.log.
3. Identify the REAL root cause.
4. Fix the project files directly.
5. Preserve all existing POS functionality.
6. Do NOT remove features just to make the build pass.
7. Keep Gradle 8.11.1.
8. Keep Android Gradle Plugin 8.8.2 unless a compatibility issue absolutely requires a change.
9. Keep JDK 17.
10. Fix missing Gradle Wrapper files if required.
11. Fix Kotlin, Android, dependency, manifest, resource, Java or Gradle errors when present.
12. Do not use fake placeholder files.
13. Do not modify secrets or expose credentials.
14. After making the fixes, inspect the changed files carefully.

Build error:
$(cat build-error.log)
"

            echo "AI repair completed."

            git status --short

            if git diff --quiet; then
              echo "AI did not make any changes."
            else
              git config user.name "CH UMER AI Builder"
              git config user.email "actions@github.com"

              git add -A
              git commit -m "AI: automatic Android build repair attempt $ATTEMPT"
              git push origin HEAD:main
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "Final build failed."
            exit 1
          fi

      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CH-UMER-POS-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: CH-UMER-POS-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
